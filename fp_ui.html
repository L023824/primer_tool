// ── Step 5: Completeness check ────────────────────────────────────────────────
function renderValidation(el) {
  const checks = runChecks();
  const passed = checks.filter(c => c.pass).length;
  const total = checks.length;
  const pct = Math.round((passed / total) * 100);
  const ringCls = pct >= 80 ? "great" : pct >= 55 ? "ok" : "low";
  const summary = pct >= 80 ? "Ready to generate — good coverage"
                : pct >= 55 ? "Usable with gaps — warnings non-blocking"
                : "Thin scaffold — consider filling more fields";

  el.innerHTML = `
    <div class="panel">
      <div class="panel-title">Completeness check</div>
      <div class="step-info-row">
        <div class="panel-subtitle">Rule-based validation across 7 dimensions. Warnings are non-blocking — you can generate and fill gaps later.</div>
        <button class="info-btn" id="btn-info-validate" onclick="toggleInfo('info-validate')" title="What to know">?</button>
      </div>
      <div class="info-drawer" id="info-validate">
        <strong>What gets checked</strong>
        <ul>
          <li><strong>Project name and description</strong> — blank names produce unnamed scaffolds that are hard to distinguish in a folder of projects.</li>
          <li><strong>Domain context</strong> — at minimum a TA and brand should be set. Without these, <code>CLAUDE.md</code> has no domain frame and Claude will ask clarifying questions at every session start.</li>
          <li><strong>Table validation</strong> — at least one table should have validated successfully. Without this, <code>EXAMPLES.md</code> uses placeholder column names and <code>schema_reference.md</code> is empty.</li>
          <li><strong>KPI definitions</strong> — at least one KPI with a name and definition. Without KPIs, <code>EXAMPLES.md</code> and <code>kpi_definitions.md</code> are stub-only.</li>
          <li><strong>SQL logic</strong> — checks whether any KPI has a SQL source set (playbook / paste / describe). KPIs without SQL logic get generic stubs in <code>EXAMPLES.md</code> that Claude has less to work from.</li>
          <li><strong>None of these are blocking</strong> — the green download button is always active. Fix gaps after download by editing the files directly, or re-run primerMD with the same session.</li>
        </ul>
      </div>

      <div class="score-panel">
        <div class="score-header">
          <div class="score-ring ${ringCls}">${pct}%</div>
          <div>
            <div class="score-label">${summary}</div>
            <div class="score-sub">${passed} of ${total} checks passed</div>
          </div>
        </div>
        <div class="check-list" id="check-list-items">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="back()">← Back</button>
        <button class="btn btn-primary" onclick="generatePreview()">
          <span id="gen-spinner" class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,0.4)"></span>
          Generate scaffold →
        </button>
        <button class="btn btn-ghost" onclick="reset()">Start over</button>
      </div>
    </div>`;

  // Populate check items after innerHTML is set — avoids nested template literal syntax errors
  renderCheckItems(checks);
}

function renderCheckItems(checks) {
  var container = document.getElementById("check-list-items");
  if (!container) return;
  container.innerHTML = "";
  for (var i = 0; i < checks.length; i++) {
    try {
      var c = checks[i];
      var item = document.createElement("div");
      item.className = "check-item";

      var icon = document.createElement("div");
      icon.className = "check-icon";
      icon.textContent = c.pass ? "✅" : "⚠️";

      var text = document.createElement("div");
      text.className = "check-text" + (c.pass ? "" : " check-gap");

      var strong = document.createElement("strong");
      strong.textContent = c.label;
      text.appendChild(strong);
      text.appendChild(document.createTextNode(" \u2014 " + c.msg));

      item.appendChild(icon);
      item.appendChild(text);
      container.appendChild(item);
    } catch(e) {
      // skip broken item, keep rendering the rest
    }
  }
}

function runChecks() {
  const s = state;

  // Safe accessors — guard against undefined state during transitions
  const projectName    = (s.project_name || "").trim();
  const description    = (s.description  || "").trim();
  const owner          = (s.owner        || "").trim();
  const audience       = s.audience      || [];
  const tablesRaw      = (s.tables_raw   || "").trim();
  const tableList      = tablesRaw.split(/[\n,]+/).map(t=>t.trim()).filter(t=>t && t.includes("."));
  const validatedCount = Object.values(s.validated_tables || {}).filter(r=>r.ok).length;
  const kpis           = s.kpis || [];

  // KPI check — fully guarded
  let kpiPass = false;
  let kpiMsg  = "No KPIs — kpi_definitions.md will be blank template";
  try {
    const named   = kpis.filter(k => ((k && k.name) || k || "").toString().trim());
    const withDef = named.filter(k => ((k && k.definition) || "").toString().trim());
    kpiPass = named.length > 0;
    if (named.length === 0) {
      kpiMsg = "No KPIs — kpi_definitions.md will be blank template";
    } else if (withDef.length === named.length) {
      kpiMsg = named.length + " KPI(s) with definitions \u2713";
    } else {
      kpiMsg = named.length + " KPI(s) named, " + (named.length - withDef.length) + " missing definition";
    }
  } catch(e) {
    kpiMsg = "KPI check error — continue anyway";
  }

  return [
    {
      label: "Project name",
      pass: projectName.length > 0,
      msg:  projectName ? '"' + projectName + '"' : "Missing — CLAUDE.md header will be unnamed",
    },
    {
      label: "Description",
      pass: description.length > 20,
      msg:  description.length > 20 ? "Provided \u2713" : "Too brief or missing — CLAUDE.md context will be thin",
    },
    {
      label: "Tables in scope",
      pass: tablesRaw.length > 0,
      msg:  tablesRaw.length ? tableList.length + " table(s) listed" : "No tables entered — schema_reference.md will be empty",
    },
    {
      label: "Table validation",
      pass: validatedCount > 0,
      msg:  validatedCount > 0
        ? validatedCount + "/" + tableList.length + " validated — real column data \u2713"
        : "Not run — schema_reference.md will use placeholders",
    },
    {
      label: "KPIs defined",
      pass: kpiPass,
      msg:  kpiMsg,
    },
  ];
}

// ── Step 6: Preview & download ────────────────────────────────────────────────
async function generatePreview() {
  const spinner = $("gen-spinner");
  if (spinner) spinner.style.display = "block";

  try {
    state.previewFiles = buildPreviewFiles();
    next();
  } catch(err) {
    toast("Preview error: " + err.message, true);
    console.error("generatePreview error:", err);
  } finally {
    if (spinner) spinner.style.display = "none";
  }
}

function buildPreviewFiles() {
  const s = state;
  const today = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  const audienceStr = (s.audience||[]).length ? s.audience.join(", ") : "not specified";
  const tableList = Object.keys(s.validated_tables||{}).length
    ? Object.keys(s.validated_tables).map(t => `- \`${t}\``).join("\n")
    : (s.tables_raw||"").split(/[\n,]+/).map(t => `- \`${t.trim()}\``).filter(Boolean).join("\n") || "- *(none listed)*";
  const kpiList = (s.kpis||[]).filter(k=>String(k&&k.name||"").trim()).map(k=>`- ${k&&k.name||k}`).join("\n") || "- *(none defined)*";

  const files = {};

  // CLAUDE.md
  const domainSections = (s.domains||[]).filter(d => d.therapeutic_area || d.brand || d.market_context).map((d, i) => {
    const label = [d.therapeutic_area, d.brand].filter(Boolean).join(" / ") || `Domain ${i+1}`;
    const lines = [];
    if (d.therapeutic_area)   lines.push(`**Therapeutic area**: ${d.therapeutic_area}`);
    if (d.brand)              lines.push(`**Brand / drug**: ${d.brand}`);
    if ((d.indication||[]).length) {
      const indStr = d.indication.map(x => x === "Other" && d.indication_other ? `Other (${d.indication_other})` : x).join(", ");
      lines.push(`**Indication(s)**: ${indStr}`);
    }
    if (d.key_population)     lines.push(`**Key population**: ${d.key_population}`);
    if (d.known_exclusions)   lines.push(`**Known exclusions**: ${d.known_exclusions}`);
    if ((d.data_sources||[]).length) {
      const dsStr = d.data_sources.map(x => x === "Other" && d.data_sources_other ? `Other (${d.data_sources_other})` : x).join(", ");
      lines.push(`**Data sources**: ${dsStr}`);
    }
    if (d.market_context)     lines.push(`\n**Market context:**\n${d.market_context}`);
    return `### Domain ${i+1} — ${label}\n\n${lines.join("\n")}`;
  }).join("\n\n");

  const activeVocab = (s.table_vocab||[]).filter(v => v.term && v.term.trim());
  const vocabSection = activeVocab.length
    ? `\n## Vocabulary\n\n| Term | Alias | Definition / Convention |\n|------|-------|-------------------------|\n` +
      activeVocab.map(v => `| **${v.term}** | ${v.alias||"—"} | ${v.definition||"—"} |`).join("\n")
    : "";

  files["CLAUDE.md"] = `# CLAUDE.md — ${s.project_name || "Unnamed Project"}
*Generated by primerMD on ${today}*

## Project overview
${s.description || "*(description not provided)*"}

**Produces visual deliverable**: ${s.visual_output ? "Yes — styling_guide.md included" : "No"}
**Owner**: ${s.owner || "—"}
**Audience**: ${audienceStr}

## Tables in scope
${tableList}

## KPIs in scope
${kpiList}
${domainSections ? `\n## Domain context\n\n${domainSections}\n` : ""}${vocabSection}

## SQL conventions
- Use persistent temp tables — avoid CTEs for multi-step logic
- Naming: temp_[project]_[step]
- Drop-if-exists before creating
- Redshift: avoid frame clauses beyond ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
`;

  // schema_reference.md — real column data if validated
  const validated = s.validated_tables;
  if (Object.keys(validated).length > 0) {
    let schemaContent = `# Schema reference\n*Generated ${today} — live Redshift metadata*\n\n`;
    for (const [tbl, meta] of Object.entries(validated)) {
      if (!meta.ok) {
        schemaContent += `## \`${tbl}\`\n> ❌ ${meta.error}\n\n`;
        continue;
      }
      const dist = meta.columns.find(c=>c.distkey)?.name || "none";
      const sorts = meta.columns.filter(c=>c.sortkey>0).sort((a,b)=>a.sortkey-b.sortkey).map(c=>c.name).join(", ") || "none";
      const rowStr = meta.row_count >= 0 ? meta.row_count.toLocaleString() : "unknown";
      schemaContent += `## \`${tbl}\`
**Approx rows**: ${rowStr} | **DISTKEY**: \`${dist}\` | **SORTKEYS**: \`${sorts}\`

| Column | Type | Nullable | Keys |
|--------|------|----------|------|
${meta.columns.map(c=>{
  const keys=[];
  if(c.distkey) keys.push("DIST");
  if(c.sortkey>0) keys.push(`SORT${c.sortkey}`);
  if(!c.nullable) keys.push("NOT NULL");
  return `| \`${c.name}\` | \`${c.type}\` | ${c.nullable?"Yes":"No"} | ${keys.join(" ")||""} |`;
}).join("\n")}

`;
    }
    files["schema_reference.md"] = schemaContent;
  } else {
    files["schema_reference.md"] = `# Schema reference\n*Generated ${today}*\n\n> ⚠️ Tables not yet validated against Redshift. Re-run primerMD with validation to populate real column metadata.\n\n## Tables referenced\n${tableList}\n`;
  }

  // kpi_definitions.md
  const kpis = (s.kpis||[]).filter(k=>String(k&&k.name||"").trim());
  const allTables = Object.keys(s.validated_tables).length
    ? Object.keys(s.validated_tables).map(t=>`\`${t}\``).join(", ")
    : s.tables_raw.split(/[\n,]+/).map(t=>t.trim()).filter(Boolean).map(t=>`\`${t}\``).join(", ") || "*(specify)*";
  files["kpi_definitions.md"] = `# KPI definitions\n*Generated ${today}*\n\n${
    kpis.length
      ? kpis.map(k => {
          const name    = k.name || k;
          const def     = (k.definition||"").trim() || "*(fill in)*";
          const grain   = (k.grain||"").trim()       || "*(fill in)*";
          const twRaw   = (k.time_window||"").trim();
          const tw      = twRaw === "Custom date range"
                          ? ((k.time_window_custom||"").trim() || "Custom date range")
                          : (twRaw || "*(fill in)*");
          const caveats = (k.caveats||"").trim()     || "*(fill in)*";
          return `### ${name}\n\n**Business definition**: ${def}\n**Data source**: ${allTables}\n**Grain**: ${grain}\n**Time window**: ${tw}\n\`\`\`sql\n-- TODO: canonical SQL\n\`\`\`\n**Known caveats**: ${caveats}\n`;
        }).join("\n")
      : "*No KPIs specified.*\n"
  }`;

  // README.md
  files["README.md"] = `# ${s.project_name || "Project"}
*Generated ${today}*

## What this is
${s.description || "*(not provided)*"}

**Owner**: ${s.owner || "—"} | **Audience**: ${audienceStr}

## Data sources
\`\`\`
${s.tables_raw || "*(not specified)*"}
\`\`\`

## Revision history
| Date | Author | Change |
|------|--------|--------|
| ${today} | ${s.owner || "—"} | Initial scaffold |
`;

  if (s.visual_output) {
    files["styling_guide.md"] = `# Styling guide\n*Generated ${today}*\n\n## Lilly brand\n- Primary: \`#D52B1E\`\n- Text: \`#1A1A1A\`\n- Background: \`#F5F5F5\`\n\n## Chart conventions\n- Horizontal bars for HCP/patient lists\n- Line charts for time series\n- Minimum font: 11px in charts\n`;
  }

  if ((s.stakeholder_notes||"").trim()) {
    files["stakeholder_notes.md"] = `# Stakeholder notes\n*Generated ${today}*\n\n## Audience\n${audienceStr}\n\n## Notes\n${s.stakeholder_notes}\n`;
  }

  const validatedNames = Object.keys(s.validated_tables).filter(k => s.validated_tables[k].ok);
  const kpiNames = kpis.map(k => k.name || k).filter(Boolean);

  // EXAMPLES.md — client-side preview
  files["EXAMPLES.md"] = `# EXAMPLES.md — ${s.project_name || "Project"}
*Generated ${today}*

> One query stub per KPI, with your actual table and column names pre-filled.
> Download to see the full file.

${kpiNames.length ? kpiNames.map((k, i) => `## Example ${i+1} — ${k}

**Business question**: How do we measure **${k}** for this project?
**Tables**: ${validatedNames.length ? validatedNames.slice(0,2).join(", ") : "*(validate tables to pre-fill)*"}

\`\`\`sql
-- ${k}
-- TODO: add metric-specific logic
-- Reference kpi_definitions.md for pattern notes and pre-flight guidance
\`\`\`
`).join("\n") : "*No KPIs specified — add KPIs in step 4 to generate examples.*\n"}
`;

  return files;
}

  activePreviewTab = name;
  document.querySelectorAll(".preview-tab").forEach(t => {
    t.classList.toggle("active", t.textContent === name);

async function downloadAll() {
  const btn = $("btn-download");
  const spinner = $("dl-spinner");
  btn.disabled = true;
  spinner.style.display = "block";

  try {
    const resp = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      toast("Generation error: " + (e.error || resp.statusText), true);
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const cd = resp.headers.get("Content-Disposition") || "";
    const match = cd.match(/filename="?([^"]+)"?/);
    a.download = match ? match[1] : "file_primer_scaffold.zip";
    a.href = url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("Scaffold downloaded — session.json included for refresh path ✓");
  } catch (err) {
    toast("Download error: " + err.message, true);
  } finally {
    btn.disabled = false;
    spinner.style.display = "none";
  }
}

function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Connection screen logic ───────────────────────────────────────────────────

async function checkConnection() {
  try {
    const res = await fetch("/status");
    const data = await res.json();
    if (data.connected) {
      showMainApp();
    } else {
      showConnectScreen();
    }
  } catch (e) {
    // If /status itself fails (e.g. app starting up), show connect screen
    showConnectScreen();
  }
}

function showConnectScreen() {
  const cs = document.getElementById("connect-screen");
  const ma = document.getElementById("main-app");
  cs.style.display = "flex";
  ma.style.display = "none";
}

function showMainApp() {
  const cs = document.getElementById("connect-screen");
  const ma = document.getElementById("main-app");
  cs.style.display = "none";
  ma.style.display = "flex";
  renderHome();
}

async function submitConnect() {
  const btn = document.getElementById("connect-btn");
  const err = document.getElementById("connect-error");
  btn.disabled = true;
  btn.style.opacity = "0.6";
  btn.textContent = "Connecting…";
  err.style.display = "none";

  const payload = {
    user:     document.getElementById("db_user").value.trim(),
    password: document.getElementById("db_password").value,
  };

  try {
    const res = await fetch("/connect", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.status === "ok") {
      showMainApp();
    } else {
      err.textContent = data.message || "Connection failed. Check your credentials and try again.";
      err.style.display = "block";
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.textContent = "Connect";
    }
  } catch (e) {
    err.textContent = "Network error — could not reach the server.";
    err.style.display = "block";
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.textContent = "Connect";
  }
}

checkConnection();
