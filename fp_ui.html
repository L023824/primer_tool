<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>primerMD — Lilly BI&A</title>
<style>
  :root {
    --red: #D52B1E;
    --red-light: #FBE9E8;
    --red-dark: #A01F14;
    --gray-50: #F8F8F8;
    --gray-100: #F0F0F0;
    --gray-200: #E0E0E0;
    --gray-400: #9E9E9E;
    --gray-600: #5E5E5E;
    --gray-800: #1E1E1E;
    --green: #1B7B3A;
    --green-light: #E8F5ED;
    --amber: #8A5700;
    --amber-light: #FFF3D6;
    --blue: #0047BB;
    --blue-light: #E8EEFA;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.10);
    --font: "Helvetica Neue", Arial, sans-serif;
    --mono: "Courier New", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--gray-50);
    color: var(--gray-800);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--red);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-800);
  }
  .logo-sub {
    font-size: 11px;
    color: var(--gray-400);
    margin-left: 4px;
  }
  header nav {
    margin-left: auto;
    font-size: 12px;
    color: var(--gray-400);
  }

  /* Progress bar */
  .progress-wrap {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 0 2rem;
  }
  .progress-steps {
    display: flex;
    gap: 0;
    max-width: 800px;
    margin: 0 auto;
  }
  .step-tab {
    flex: 1;
    padding: 12px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: default;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .step-tab.active { border-bottom-color: var(--red); }
  .step-tab.done { border-bottom-color: var(--gray-200); }
  .step-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    background: var(--gray-100);
    color: var(--gray-400);
    transition: all 0.2s;
  }
  .step-tab.active .step-num { background: var(--red); color: #fff; }
  .step-tab.done .step-num { background: var(--green); color: #fff; }
  .step-label {
    font-size: 10px;
    color: var(--gray-400);
    text-align: center;
    line-height: 1.3;
  }
  .step-tab.active .step-label { color: var(--red); font-weight: 500; }

  /* Main layout */
  main {
    flex: 1;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 2.5rem 1rem 4rem;
  }

  /* Panels */
  .panel {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: var(--shadow);
  }
  .panel-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 4px;
  }
  .panel-subtitle {
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 1.75rem;
    line-height: 1.5;
  }

  /* Form controls */
  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-600);
    margin-bottom: 6px;
  }
  label.field-label span {
    color: var(--red);
    margin-left: 2px;
  }
  input[type="text"], textarea, select {
    display: block;
    width: 100%;
    font-family: var(--font);
    font-size: 14px;
    color: var(--gray-800);
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(213,43,30,0.08);
  }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .field-hint {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 5px;
  }
  .field-group { margin-bottom: 1.25rem; }

  /* Output type cards */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .type-card {
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    user-select: none;
  }
  .type-card:hover { border-color: var(--red); background: var(--red-light); }
  .type-card.selected { border-color: var(--red); background: var(--red-light); }
  .type-card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-800);
  }
  .type-card-desc {
    font-size: 12px;
    color: var(--gray-600);
    line-height: 1.4;
  }
  .type-card-files {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 4px;
    font-family: var(--mono);
  }

  /* Audience chips */
  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 100px;
    border: 1.5px solid var(--gray-200);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--gray-600);
    background: #fff;
    transition: all 0.15s;
    user-select: none;
  }
  .chip:hover { border-color: var(--red); color: var(--red); }
  .chip.selected {
    border-color: var(--red);
    background: var(--red);
    color: #fff;
  }

  /* Table validation */
  .table-input-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .table-input-row textarea {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
  }
  .validate-btn {
    padding: 9px 16px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    height: 38px;
    align-self: flex-start;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .validate-btn:hover { background: #003899; }
  .validate-btn:disabled { background: var(--gray-400); cursor: not-allowed; }

  /* Validation results */
  .val-results { margin-top: 1rem; display: flex; flex-direction: column; gap: 10px; }
  .val-card {
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .val-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .val-card-header:hover { background: var(--gray-50); }
  .val-card.ok .val-card-header { background: var(--green-light); }
  .val-card.err .val-card-header { background: #FEE; }
  .val-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 100px;
  }
  .val-card.ok .val-badge { background: var(--green); color: #fff; }
  .val-card.err .val-badge { background: #C62828; color: #fff; }
  .val-card-meta {
    margin-left: auto;
    font-size: 11px;
    color: var(--gray-400);
    font-weight: 400;
  }
  .val-card-toggle { margin-left: 6px; font-size: 12px; color: var(--gray-400); }
  .val-card-body {
    display: none;
    padding: 12px 14px;
    border-top: 1px solid var(--gray-200);
    overflow-x: auto;
  }
  .val-card-body.open { display: block; }
  .col-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .col-table th {
    text-align: left;
    font-weight: 500;
    color: var(--gray-600);
    padding: 4px 8px;
    border-bottom: 1px solid var(--gray-200);
  }
  .col-table td {
    padding: 4px 8px;
    color: var(--gray-800);
    border-bottom: 1px solid var(--gray-100);
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .col-table tr:last-child td { border-bottom: none; }
  .badge-dist { background: #E8EEFA; color: var(--blue); padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .badge-sort { background: var(--amber-light); color: var(--amber); padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .badge-nn { background: #FEF0F0; color: #C62828; padding: 1px 6px; border-radius: 4px; font-size: 10px; }

  /* Validation score */
  .score-panel {
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .score-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    background: var(--gray-50);
  }
  .score-ring {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .score-ring.great { background: var(--green-light); color: var(--green); }
  .score-ring.ok { background: var(--amber-light); color: var(--amber); }
  .score-ring.low { background: #FEE; color: #C62828; }
  .score-label { font-size: 14px; font-weight: 600; }
  .score-sub { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
  .check-list { padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
  }
  .check-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .check-text { line-height: 1.5; }
  .check-text strong { font-weight: 500; }
  .check-gap { color: var(--amber); }

  /* Preview tabs */
  .preview-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--gray-200); margin-bottom: 0; overflow-x: auto; }
  .preview-tab {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-600);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    font-family: var(--mono);
    transition: all 0.15s;
  }
  .preview-tab:hover { color: var(--red); }
  .preview-tab.active { color: var(--red); border-bottom-color: var(--red); }
  .preview-content {
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 1.25rem;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 360px;
    overflow-y: auto;
    color: var(--gray-800);
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 1.75rem;
    align-items: center;
  }
  .btn {
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: var(--font);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-primary:disabled { background: var(--gray-400); cursor: not-allowed; }
  .btn-secondary {
    background: #fff;
    color: var(--gray-600);
    border: 1px solid var(--gray-200);
  }
  .btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-400); }
  .btn-ghost { background: none; color: var(--gray-400); border: none; font-size: 13px; margin-left: auto; }
  .btn-ghost:hover { color: var(--red); }
  .btn-success { background: var(--green); color: #fff; }
  .btn-success:hover { background: #145E2C; }

  /* Spinner */
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Prompting examples ─────────────────────────────────────────────────── */
  .prompt-section {
    margin-bottom: 3rem;
  }
  .prompt-pair {
    margin-bottom: 1.25rem;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #fff;
  }
  .prompt-pair-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .prompt-pair-label.without {
    background: #fdf3f2;
    color: #a01f14;
  }
  .prompt-pair-label.with {
    background: var(--green-light);
    color: var(--green);
  }
  .prompt-pair-label .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .prompt-pair-label.without .dot { background: var(--red); }
  .prompt-pair-label.with .dot    { background: var(--green); }
  .prompt-body {
    padding: 13px 16px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--gray-700, #3a3a3a);
    font-family: var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .prompt-body.without {
    background: #fff;
    color: var(--gray-600);
    border-bottom: 1px solid var(--gray-100);
  }
  .prompt-body.with {
    background: var(--green-light);
    color: #145228;
    font-weight: 500;
  }
  .prompt-scenario {
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 1.5rem 0 0.6rem;
  }
  .prompt-scenario:first-child { margin-top: 0; }

  /* ── Session resume ─────────────────────────────────────────────────────── */
  .home-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 1.75rem;
  }
  .home-split-card {
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .home-split-card.primary {
    border-color: var(--red);
    background: var(--red-light);
  }
  .home-split-card h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--gray-800);
  }
  .home-split-card p {
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.55;
    flex: 1;
  }
  .upload-zone {
    border: 1.5px dashed var(--gray-200);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    background: var(--gray-50);
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--blue);
    background: var(--blue-light);
  }
  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .upload-zone-label {
    font-size: 13px;
    color: var(--gray-400);
    pointer-events: none;
  }
  .upload-zone-label strong {
    color: var(--blue);
    font-weight: 600;
  }
  .upload-zone.loaded {
    border-color: var(--green);
    background: var(--green-light);
  }
  .upload-zone.loaded .upload-zone-label { color: var(--green); }

  /* Resume diff screen */
  .resume-wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 2.5rem 1rem 4rem;
  }
  .resume-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.75rem;
  }
  .resume-header-icon {
    width: 40px; height: 40px;
    background: var(--blue-light);
    border: 1.5px solid #c5d3f0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .resume-header-text h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--gray-800);
    margin-bottom: 3px;
  }
  .resume-header-text p {
    font-size: 13px;
    color: var(--gray-600);
  }
  .resume-summary {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 1.25rem;
  }
  .resume-summary-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--gray-400);
    margin-bottom: 14px;
  }
  .resume-field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .resume-field {
    background: var(--gray-50);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .resume-field-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .resume-field-value {
    font-size: 13px;
    color: var(--gray-800);
    font-weight: 500;
    line-height: 1.4;
  }
  .resume-field-value.muted { color: var(--gray-400); font-style: italic; font-weight: 400; }
  .resume-hints {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .resume-hint {
    background: var(--amber-light);
    border: 1px solid #e8c97a;
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .resume-hint-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .resume-hint-body {}
  .resume-hint-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--amber);
    margin-bottom: 3px;
  }
  .resume-hint-detail {
    font-size: 12px;
    color: var(--gray-600);
    line-height: 1.5;
  }
  .resume-hint-jump {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--amber);
    background: rgba(138,87,0,0.08);
    border: 1px solid rgba(138,87,0,0.2);
    border-radius: 100px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
    align-self: center;
    transition: background 0.15s;
  }
  .resume-hint-jump:hover { background: rgba(138,87,0,0.15); }
  .resume-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ── Step info tooltip ───────────────────────────────────────────────────── */
  .step-info-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 1.75rem;
  }
  .step-info-row .panel-subtitle {
    margin-bottom: 0;
    flex: 1;
  }
  .info-btn {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--gray-200);
    background: #fff;
    color: var(--gray-400);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    margin-top: 1px;
    position: relative;
  }
  .info-btn:hover, .info-btn.active {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-light);
  }
  .info-drawer {
    background: var(--blue-light);
    border: 1px solid #c5d3f0;
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 1.5rem;
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.65;
    display: none;
  }
  .info-drawer.open { display: block; }
  .info-drawer strong {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--blue);
    margin-bottom: 8px;
  }
  .info-drawer ul {
    margin: 0;
    padding-left: 18px;
  }
  .info-drawer ul li {
    margin-bottom: 5px;
  }
  .info-drawer ul li:last-child { margin-bottom: 0; }
  .info-drawer code {
    font-family: var(--mono);
    font-size: 12px;
    background: rgba(0,71,187,0.08);
    color: var(--blue);
    padding: 1px 5px;
    border-radius: 4px;
  }

  /* ── Home page ───────────────────────────────────────────────────────────── */
  .home-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .home-hero {
    display: flex;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 3rem;
  }

  .home-hero-mark {
    flex-shrink: 0;
    width: 56px; height: 56px;
    background: var(--red);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
    box-shadow: 0 4px 16px rgba(213,43,30,0.22);
    margin-top: 4px;
  }

  .home-hero-text h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--gray-800);
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .home-hero-text h1 em {
    font-style: normal;
    color: var(--red);
  }

  .home-hero-text p {
    font-size: 15px;
    color: var(--gray-600);
    line-height: 1.65;
    max-width: 560px;
  }

  .home-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 1.5rem;
    padding: 11px 24px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-decoration: none;
  }
  .home-cta:hover { background: var(--red-dark); transform: translateY(-1px); }
  .home-cta-arrow { font-size: 16px; }

  .home-section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-400);
    margin-bottom: 1rem;
  }

  /* How it works steps */
  .home-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 3rem;
  }
  .home-step-card {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 18px 16px;
    position: relative;
  }
  .home-step-num {
    display: inline-block;
    width: 24px; height: 24px;
    background: var(--red-light);
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
    border-radius: 6px;
    text-align: center;
    line-height: 24px;
    margin-bottom: 10px;
  }
  .home-step-card h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 5px;
  }
  .home-step-card p {
    font-size: 12px;
    color: var(--gray-600);
    line-height: 1.5;
  }

  /* File cards */
  .home-files {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 3rem;
  }
  .file-card {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .file-card:hover {
    border-color: var(--gray-400);
    box-shadow: var(--shadow);
  }
  .file-card-icon {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .file-card-body {}
  .file-card-name {
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--gray-800);
    margin-bottom: 4px;
  }
  .file-card-trigger {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }
  .file-card-desc {
    font-size: 12px;
    color: var(--gray-600);
    line-height: 1.5;
  }

  /* Always-generated badge */
  .badge-always {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 100px;
    background: var(--green-light);
    color: var(--green);
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.02em;
  }
  .badge-conditional {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 100px;
    background: var(--amber-light);
    color: var(--amber);
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.02em;
  }

  .home-divider {
    border: none;
    border-top: 1px solid var(--gray-200);
    margin: 2.5rem 0;
  }

  /* Claude usage tip */
  .home-usage-tip {
    background: var(--blue-light);
    border: 1px solid #c5d3f0;
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 3rem;
  }
  .home-usage-tip-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .home-usage-tip-body {}
  .home-usage-tip-body strong {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
    margin-bottom: 6px;
  }
  .home-usage-tip-body p {
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .home-usage-tip-body code {
    font-family: var(--mono);
    font-size: 12px;
    background: rgba(0,71,187,0.07);
    color: var(--blue);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--gray-800);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
    max-width: 320px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { background: #C62828; }

  /* Misc helpers */
  .divider { height: 1px; background: var(--gray-200); margin: 1.5rem 0; }
  .hidden { display: none !important; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .tag-blue { background: var(--blue-light); color: var(--blue); }
  .tag-green { background: var(--green-light); color: var(--green); }

  /* Step transitions */
  .step-panel { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ── Connection screen (shown when no session credentials / env vars present) ── -->
<div id="connect-screen" style="display:none; justify-content:center; align-items:center;
     min-height:100vh; background:var(--gray-50);">
  <div style="background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-lg);
              padding:40px 36px; width:420px; box-shadow:var(--shadow-md);">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <div class="logo-mark" style="width:32px;height:32px;font-size:13px;">pM</div>
      <span style="font-weight:700;font-size:16px;color:var(--gray-800);">primerMD</span>
    </div>
    <h2 style="font-size:20px;font-weight:700;color:var(--gray-800);margin-bottom:6px;">
      Sign in to continue
    </h2>
    <p style="font-size:13px;color:var(--gray-600);margin-bottom:24px;line-height:1.5;">
      Enter your Redshift credentials to begin.<br>
      These are stored in your browser session only — never on the server.
    </p>

    <label style="font-size:11px;font-weight:700;text-transform:uppercase;
                  letter-spacing:0.06em;color:var(--gray-600);">Username</label>
    <input id="db_user" type="text" placeholder="your-username"
           style="width:100%;margin:4px 0 14px;padding:9px 12px;border:1px solid var(--gray-200);
                  border-radius:var(--radius);font-size:13px;font-family:var(--font);outline:none;"
           onkeydown="if(event.key==='Enter')submitConnect()">

    <label style="font-size:11px;font-weight:700;text-transform:uppercase;
                  letter-spacing:0.06em;color:var(--gray-600);">Password</label>
    <input id="db_password" type="password" placeholder="••••••••"
           style="width:100%;margin:4px 0 20px;padding:9px 12px;border:1px solid var(--gray-200);
                  border-radius:var(--radius);font-size:13px;font-family:var(--font);outline:none;"
           onkeydown="if(event.key==='Enter')submitConnect()">

    <div id="connect-error"
         style="display:none;background:var(--red-light);color:var(--red-dark);font-size:12.5px;
                padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;line-height:1.5;">
    </div>

    <button id="connect-btn" onclick="submitConnect()"
            style="width:100%;background:var(--red);color:#fff;border:none;
                   border-radius:var(--radius);padding:11px;font-size:14px;
                   font-weight:700;cursor:pointer;font-family:var(--font);
                   transition:opacity 0.15s;">
      Connect
    </button>
  </div>
</div>

<!-- ── Main app (hidden until connection confirmed) ───────────────────────── -->
<div id="main-app" style="display:none;flex-direction:column;min-height:100vh;">

<header>
  <a class="logo" href="#" onclick="renderHome(); return false;">
    <div class="logo-mark">pM</div>
    <span class="logo-text">primerMD</span>
    <span class="logo-sub">BI&A scaffold generator</span>
  </a>
  <nav id="env-badge"></nav>
</header>

<div class="progress-wrap">
  <div class="progress-steps" id="progress-steps"></div>
</div>

<main id="main-content"></main>

<div id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const STEPS = [
  { id: "mode",       label: "Output type" },
  { id: "details",   label: "Project & Domain" },
  { id: "tables",    label: "Tables & Vocab" },
  { id: "kpis",      label: "KPIs" },
  { id: "validate",  label: "Completeness" },
  { id: "preview",   label: "Preview & download" },
];

const AUDIENCES = [
  "Brand team", "Field leadership", "Medical affairs",
  "Market access", "Finance", "Executive / SLT", "External agency",
];

// Output type removed — full scaffold always generated; visual_output checkbox controls styling_guide.md

let state = {
  currentStep: 0,
  visual_output: false,
  project_name: "",
  description: "",
  owner: "",
  audience: [],
  // Domain context — merged into Step 2 (multi-domain)
  domains: [
    {therapeutic_area:"", brand:"", indication:[], indication_other:"", data_sources:[], data_sources_other:"", key_population:{}, known_exclusions:"", market_context:{}, disease_state:{}, drug_performance:{}, additional_context:""},
  ],
  vocab: [{term:"",definition:""},{term:"",definition:""}],
  table_vocab: [{term:"",alias:"",definition:""},{term:"",alias:"",definition:""}],
  stakeholder_images: [],
  tables_raw: "",
  validated_tables: {},
  kpis: [
    {name:"",definition:"",grain:"",grain_custom:"",time_window:"",time_window_custom:"",caveats:"",sql_source_mode:"",sql_playbook_entry:"",sql_pasted:"",sql_rules:{columns:"",business_rules:"",exclusions:"",edge_cases:""},pattern_notes:""},
    {name:"",definition:"",grain:"",grain_custom:"",time_window:"",time_window_custom:"",caveats:"",sql_source_mode:"",sql_playbook_entry:"",sql_pasted:"",sql_rules:{columns:"",business_rules:"",exclusions:"",edge_cases:""},pattern_notes:""},
    {name:"",definition:"",grain:"",grain_custom:"",time_window:"",time_window_custom:"",caveats:"",sql_source_mode:"",sql_playbook_entry:"",sql_pasted:"",sql_rules:{columns:"",business_rules:"",exclusions:"",edge_cases:""},pattern_notes:""},
  ],
  stakeholder_notes: "",
  previewFiles: {},
};

// ── Utilities ────────────────────────────────────────────────────────────────
function toast(msg, isErr = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show" + (isErr ? " err" : "");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = ""; }, 3200);
}

function $(id) { return document.getElementById(id); }

function toggleInfo(id) {
  const drawer = $(id);
  const btn    = $("btn-" + id);
  if (!drawer) return;
  const isOpen = drawer.classList.contains("open");
  drawer.classList.toggle("open", !isOpen);
  if (btn) btn.classList.toggle("active", !isOpen);
}



// ── Session resume ─────────────────────────────────────────────────────────────
function handleSessionDrop(e) {
  e.preventDefault();
  document.getElementById("resume-upload-zone").classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file) handleSessionFile(file);
}

function handleSessionFile(file) {
  if (!file || !file.name.endsWith(".json")) {
    toast("Please upload a session.json file", true);
    return;
  }
  const zone  = $("resume-upload-zone");
  const label = $("resume-upload-label");
  label.innerHTML = "Loading…";

  const fd = new FormData();
  fd.append("session", file);

  fetch("/load_session", { method: "POST", body: fd })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        toast("Could not load session: " + data.error, true);
        label.innerHTML = '<strong>Choose file</strong> or drag session.json here';
        return;
      }
      zone.classList.add("loaded");
      label.innerHTML = "✓ " + file.name + " loaded";
      renderResume(data.session, data.hints);
    })
    .catch(err => {
      toast("Upload failed: " + err, true);
      label.innerHTML = '<strong>Choose file</strong> or drag session.json here';
    });
}

function hydrateState(session) {
  // Merge loaded session into state with safe defaults for any missing fields
  const kpiDefaults = {
    name:"", definition:"", grain:"", grain_custom:"",
    time_window:"", time_window_custom:"", caveats:"",
    sql_source_mode:"", sql_playbook_entry:"", sql_pasted:"",
    sql_rules:{columns:"",business_rules:"",exclusions:"",edge_cases:""},
    pattern_notes:"",
  };

  state.visual_output     = session.visual_output !== undefined
    ? session.visual_output
    : ["Dashboard","Report"].includes(session.output_type || "");  // back-compat
  state.project_name      = session.project_name      || "";
  state.description       = session.description       || "";
  state.owner             = session.owner             || "";
  state.audience          = session.audience          || [];
  state.domains           = (session.domains && session.domains.length)
    ? session.domains
    : [{therapeutic_area:"", brand:"", indication:[], data_sources:[],
        key_population:"", known_exclusions:"", market_context:""}];
  state.vocab             = (session.vocab && session.vocab.length)
    ? session.vocab
    : [{term:"",definition:""},{term:"",definition:""}];
  state.tables_raw        = session.tables_raw        || "";
  state.validated_tables  = session.validated_tables  || {};
  state.kpis              = (session.kpis && session.kpis.length)
    ? session.kpis.map(k => Object.assign({}, kpiDefaults, k))
    : [Object.assign({}, kpiDefaults)];
  state.stakeholder_notes = session.stakeholder_notes || "";
  state.previewFiles      = {};
}

function renderResume(session, hints) {
  onHomePage = false;
  document.querySelector(".progress-wrap").style.display = "none";

  // Hydrate state so all steps are pre-filled when user navigates in
  hydrateState(session);

  const el = $("main-content");

  const kpis    = (session.kpis || []).filter(k => k && (k.name || k));
  const domains = (session.domains || []).filter(d => d.therapeutic_area || d.brand);
  const tables  = Object.keys(session.validated_tables || {}).filter(t =>
    (session.validated_tables[t] || {}).ok
  );
  const pname   = session.project_name || "Unnamed project";
  const otype   = session.visual_output ? "Visual deliverable" : "Data / SQL";
  const owner   = session.owner        || "—";
  const aud     = (session.audience || []).join(", ") || "—";

  const domainSummary = domains.map(d =>
    [d.therapeutic_area, d.brand].filter(Boolean).join(" · ")
  ).join(" | ") || "—";

  const kpiSummary = kpis.length
    ? kpis.map(k => k.name || k).slice(0, 5).join(", ")
      + (kpis.length > 5 ? ` +${kpis.length - 5} more` : "")
    : "—";

  const tableSummary = tables.length
    ? tables.slice(0, 4).join(", ") + (tables.length > 4 ? ` +${tables.length - 4} more` : "")
    : "None validated";

  const hintBlocks = hints.length
    ? hints.map(h => `
      <div class="resume-hint">
        <div class="resume-hint-icon">⚠️</div>
        <div class="resume-hint-body">
          <div class="resume-hint-label">${h.label}</div>
          <div class="resume-hint-detail">${h.detail}</div>
        </div>
        <button class="resume-hint-jump" onclick="jumpToStep(${h.step})">Go to step ${h.step} →</button>
      </div>`).join("")
    : `<div style="font-size:13px;color:var(--green);background:var(--green-light);border:1px solid #a3d5b4;border-radius:var(--radius);padding:12px 16px;">
        ✓ No obvious gaps detected — everything looks complete. Review and generate when ready.
       </div>`;

  el.innerHTML = `
  <div class="resume-wrap">
    <div class="resume-header">
      <div class="resume-header-icon">🔄</div>
      <div class="resume-header-text">
        <h2>Session loaded — ${esc(pname)}</h2>
        <p>Review what was loaded. Update anything that's changed since the last run, then generate a fresh scaffold.</p>
      </div>
    </div>

    <div class="resume-summary">
      <div class="resume-summary-title">What was loaded</div>
      <div class="resume-field-grid">
        <div class="resume-field">
          <div class="resume-field-label">Project name</div>
          <div class="resume-field-value">${esc(pname)}</div>
        </div>
        <div class="resume-field">
          <div class="resume-field-label">Output type</div>
          <div class="resume-field-value">${esc(otype)}</div>
        </div>
        <div class="resume-field">
          <div class="resume-field-label">Owner</div>
          <div class="resume-field-value">${esc(owner)}</div>
        </div>
        <div class="resume-field">
          <div class="resume-field-label">Audience</div>
          <div class="resume-field-value ${aud === "—" ? "muted" : ""}">${esc(aud)}</div>
        </div>
        <div class="resume-field">
          <div class="resume-field-label">Domain(s)</div>
          <div class="resume-field-value ${domainSummary === "—" ? "muted" : ""}">${esc(domainSummary)}</div>
        </div>
        <div class="resume-field">
          <div class="resume-field-label">Validated tables</div>
          <div class="resume-field-value ${tableSummary === "None validated" ? "muted" : ""}">${esc(tableSummary)}</div>
        </div>
        <div class="resume-field" style="grid-column:span 2">
          <div class="resume-field-label">KPIs (${kpis.length})</div>
          <div class="resume-field-value ${kpiSummary === "—" ? "muted" : ""}">${esc(kpiSummary)}</div>
        </div>
      </div>
    </div>

    ${hints.length ? `<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--amber);margin-bottom:10px;">Suggested updates</div>` : ""}
    <div class="resume-hints">${hintBlocks}</div>

    <div class="resume-actions">
      <button class="btn btn-primary" onclick="jumpToStep(0)">Edit step by step →</button>
      <button class="btn btn-secondary" onclick="jumpToStep(5)">Skip to completeness check</button>
      <button class="btn btn-secondary" onclick="jumpToStep(6)">Jump to preview &amp; download</button>
      <button class="btn btn-secondary" style="margin-left:auto;" onclick="renderHome()">← Load a different session</button>
    </div>
  </div>`;
}

function jumpToStep(stepIdx) {
  onHomePage = false;
  document.querySelector(".progress-wrap").style.display = "";
  goTo(stepIdx);
}

// ── Home page ─────────────────────────────────────────────────────────────────
let onHomePage = true;

function renderHome() {
  onHomePage = true;
  document.querySelector(".progress-wrap").style.display = "none";

  const el = $('main-content');
  el.innerHTML = `
  <div class="home-wrap">

    <div class="home-hero">
      <div class="home-hero-mark">pM</div>
      <div class="home-hero-text">
        <h1>Your Claude Code project,<br><em>ready before you start typing.</em></h1>
        <p>primerMD generates a structured set of scaffold files — domain context, table metadata, KPI definitions, SQL pattern guidance — wired to your real Redshift tables. Drop them into a Claude Code project and skip the 20-minute context-setting conversation at the start of every analysis.</p>

        <div class="home-split">
          <div class="home-split-card primary">
            <h3>🆕 New scaffold</h3>
            <p>Start from scratch — describe your project, validate tables, define KPIs, and download a fresh set of files.</p>
            <button class="home-cta" style="margin-top:4px;" onclick="startTool()">
              Build my scaffold <span class="home-cta-arrow">→</span>
            </button>
          </div>
          <div class="home-split-card">
            <h3>🔄 Resume from session</h3>
            <p>Upload a <code style="font-family:var(--mono);font-size:12px;background:var(--gray-100);padding:1px 5px;border-radius:4px">session.json</code> from a previous download to pick up where you left off — update time windows, add KPIs, or re-validate tables.</p>
            <div class="upload-zone" id="resume-upload-zone"
                 ondragover="event.preventDefault();this.classList.add('drag-over')"
                 ondragleave="this.classList.remove('drag-over')"
                 ondrop="handleSessionDrop(event)">
              <input type="file" accept=".json" onchange="handleSessionFile(this.files[0])">
              <div class="upload-zone-label" id="resume-upload-label">
                <strong>Choose file</strong> or drag session.json here
              </div>
            </div>
          </div>
        </div>

function startTool() {
  onHomePage = false;
  document.querySelector(".progress-wrap").style.display = "";
  goTo(0);
}

// ── Progress bar ─────────────────────────────────────────────────────────────
function renderProgress() {
  const el = $("progress-steps");
  el.innerHTML = STEPS.map((s, i) => {
    const cls = i === state.currentStep ? "active"
              : i < state.currentStep ? "done" : "";
    return `<div class="step-tab ${cls}">
      <div class="step-num">${i < state.currentStep ? "✓" : i + 1}</div>
      <div class="step-label">${s.label}</div>
    </div>`;
  }).join("");
}

// ── Navigation ───────────────────────────────────────────────────────────────
function goTo(idx) {
  state.currentStep = idx;
  renderProgress();
  renderStep();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function next() { goTo(state.currentStep + 1); }
function back() { goTo(state.currentStep - 1); }

// ── Step renderers ───────────────────────────────────────────────────────────
function renderStep() {
  const el = $("main-content");
  const renderers = [
    renderMode, renderDetails, renderTables,
    renderKPIs, renderValidation, renderPreview,
  ];
  el.innerHTML = "";
  const div = document.createElement("div");
  div.className = "step-panel";
  el.appendChild(div);
  renderers[state.currentStep](div);
}

    </div>`;
}

function selectDomainTA(i, value) {
  state.domains[i].therapeutic_area = value;
  state.domains[i].indication       = [];
  // Clear all pre-baked content dicts when TA changes
  state.domains[i].disease_state    = {};
  state.domains[i].market_context   = {};
  state.domains[i].key_population   = {};
  state.domains[i].drug_performance = {};
  renderStep();

function toggleDomainChip(i, field, value, el) {
  if (!Array.isArray(state.domains[i][field])) state.domains[i][field] = [];
  if (state.domains[i][field].includes(value)) {
    state.domains[i][field] = state.domains[i][field].filter(x => x !== value);
    // Deselected — keep content in dict but mark hidden so user can reselect
    // We intentionally do NOT delete the key
  } else {
    state.domains[i][field].push(value);
    // Newly selected indication — fetch context
    if (field === "indication" && value !== "Other") {
      fetchDomainContext(i, value);
    }
  }
  renderStep();
}

async function fetchDomainContext(i, indication) {
  const d  = state.domains[i];
  const ta = d.therapeutic_area || "";
  if (!ta || !indication) return;

  try {
    const res = await fetch(`/domain_context?ta=${encodeURIComponent(ta)}&indication=${encodeURIComponent(indication)}`);
    if (!res.ok) {
      console.warn(`fetchDomainContext: server returned ${res.status} for ${ta}/${indication}`);
      return;
    }
    const data = await res.json();
    console.log(`fetchDomainContext: received data for ${ta}/${indication}`, data);

    // Ensure content dicts exist
    if (typeof state.domains[i].disease_state    !== "object") state.domains[i].disease_state    = {};
    if (typeof state.domains[i].market_context   !== "object") state.domains[i].market_context   = {};
    if (typeof state.domains[i].key_population   !== "object") state.domains[i].key_population   = {};
    if (typeof state.domains[i].drug_performance !== "object") state.domains[i].drug_performance = {};

    // Only pre-fill if this indication has no content yet — never overwrite user edits
    if (!state.domains[i].disease_state[indication]    && data.disease_state)    state.domains[i].disease_state[indication]    = data.disease_state;
    if (!state.domains[i].market_context[indication]   && data.market_context)   state.domains[i].market_context[indication]   = data.market_context;
    if (!state.domains[i].key_population[indication]   && data.key_population)   state.domains[i].key_population[indication]   = data.key_population;
    if (!state.domains[i].drug_performance[indication] && data.drug_performance) state.domains[i].drug_performance[indication] = data.drug_performance;

    console.log(`fetchDomainContext: state updated, re-rendering`);
    renderStep();
  } catch(e) {
    console.error(`fetchDomainContext error for ${ta}/${indication}:`, e);
  }
}

async function runValidation() {
  const raw = state.tables_raw.trim();
  if (!raw) { toast("Enter at least one table first", true); return; }

  const tables = raw.split(/[\n,]+/).map(t => t.trim()).filter(t => t && t.includes("."));
  if (!tables.length) { toast("No valid schema.table entries found", true); return; }

  const btn = $("btn-validate");
  const spinner = $("val-spinner");
  const label = $("val-btn-label");
  btn.disabled = true;
  spinner.style.display = "block";
  label.textContent = "Validating…";

  try {
    const resp = await fetch("/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tables }),
    });
    if (!resp.ok) {
      const e = await resp.json();
      toast("Validation error: " + (e.error || resp.statusText), true);
      return;
    }
    const data = await resp.json();
    state.validated_tables = data.results;
    renderValResults(data.results);
    const okCount = Object.values(data.results).filter(r => r.ok).length;
    toast(`Validated ${okCount}/${tables.length} tables — schema_reference.md will include real column data ✓`);
  } catch (err) {
    toast("Network error: " + err.message, true);
  } finally {
    btn.disabled = false;
    spinner.style.display = "none";
    label.textContent = "Re-validate";
  }
}

// ── Primary key & data level inference ───────────────────────────────────────
function inferPrimaryKeys(cols) {
  const pks = [];
  // 1. Explicit DIST + NOT NULL
  const distCol = cols.find(c => c.distkey && !c.nullable);
  if (distCol) pks.push(distCol.name);
  // 2. Sort key 1 + NOT NULL, not already in list
  const sort1 = cols.find(c => c.sortkey === 1 && !c.nullable);
  if (sort1 && !pks.includes(sort1.name)) pks.push(sort1.name);
  // 3. Column name heuristic: ends in _id / _key / _cd + NOT NULL
  const heuristics = cols.filter(c =>
    !c.nullable &&
    /_id$|_key$|_cd$|_num$/.test(c.name) &&
    !pks.includes(c.name)
  ).slice(0, 2);
  heuristics.forEach(c => pks.push(c.name));
  return pks.slice(0, 3);
}

function inferDataLevel(tableName, cols, pkCols) {
  const name = tableName.toLowerCase();
  const hasPat = cols.some(c => /patient|prsn|member/.test(c.name.toLowerCase()));
  const hasHcp = cols.some(c => /provider|npi|prescrib/.test(c.name.toLowerCase()));
  const hasDate = cols.some(c => /date|month|dt$/.test(c.name.toLowerCase()));
  const hasClaim = cols.some(c => /claim|fill|rx|dispensing/.test(c.name.toLowerCase()));

  if (hasClaim && hasPat && hasHcp) return "Claim / fill level";
  if (hasPat && hasDate) return "Patient × date";
  if (hasHcp && hasDate) return "HCP × month";
  if (hasPat && !hasDate) return "Patient level";
  if (hasHcp && !hasDate) return "HCP level";
  if (/dim_|_dim|_lookup|_ref/.test(name)) return "Dimension / lookup";
  return "";
}

// ── Similar field detection ───────────────────────────────────────────────────
function findSimilarFields(results) {
  const allCols = {};
  for (const [tbl, meta] of Object.entries(results)) {
    if (!meta.ok) continue;
    for (const c of (meta.columns || [])) {
      const norm = c.name.replace(/_/g,"").toLowerCase();
      if (!allCols[norm]) allCols[norm] = [];
      allCols[norm].push({ table: tbl, col: c.name });
    }
  }
  const similar = [];
  const seen = new Set();
  const norms = Object.keys(allCols);

  // Cross-table near-matches: one norm contains the other, different tables
  for (let i = 0; i < norms.length; i++) {
    for (let j = i+1; j < norms.length; j++) {
      const a = norms[i], b = norms[j];
      if (a === b) continue;
      if (!((a.includes(b) || b.includes(a)) && Math.abs(a.length - b.length) <= 5)) continue;
      const entriesA = allCols[a], entriesB = allCols[b];
      // Only include if they appear in different tables
      const tablesA = new Set(entriesA.map(e => e.table));
      const tablesB = new Set(entriesB.map(e => e.table));
      const crossTable = [...tablesA].some(t => tablesB.has(t) === false) ||
                         [...tablesB].some(t => tablesA.has(t) === false);
      if (!crossTable) continue;
      const key = [a, b].sort().join("|");
      if (seen.has(key)) continue;
      seen.add(key);
      similar.push({ a: entriesA, b: entriesB });
    }
  }

  // Same normalised name appearing in multiple different tables = definite alias
  for (const norm of norms) {
    const entries = allCols[norm];
    const tables = [...new Set(entries.map(e => e.table))];
    if (tables.length < 2) continue; // same table duplicates — skip
    const key = "same:" + norm;
    if (seen.has(key)) continue;
    seen.add(key);
    // Group one representative per table
    const byTable = {};
    for (const e of entries) { if (!byTable[e.table]) byTable[e.table] = e; }
    const reps = Object.values(byTable);
    similar.push({ a: [reps[0]], b: reps.slice(1), sameNorm: true });
  }

  return similar;
}

    const label = pair.sameNorm ? "Same field, different alias" : "Similar names — confirm if same";
    itemsHtml += `<div style="padding:7px 0;border-bottom:1px solid rgba(232,201,122,0.4);font-size:12px;line-height:1.7;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">

        + Add to vocab
      </button>
    </div>`;
  }

  container.innerHTML = `
    <div style="background:var(--amber-light);border:1px solid #e8c97a;border-radius:var(--radius);margin-bottom:12px;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;user-select:none;"
           onclick="toggleSimilarFields()">
        <span style="font-size:12px;font-weight:600;color:var(--amber);">⚠️ ${seen.size} similar field name${seen.size > 1 ? 's' : ''} detected across tables</span>
        <span id="similar-chevron" style="margin-left:auto;font-size:11px;color:var(--amber);">▼ expand</span>
      </div>
      <div id="similar-fields-body" style="display:none;padding:4px 14px 10px;">
        <div style="font-size:11px;color:var(--gray-600);margin-bottom:6px;">Review these pairs — they may be the same field under different aliases. Click <strong>+ Add to vocab</strong> to map them.</div>
        ${itemsHtml}
      </div>
    </div>`;
}

function toggleSimilarFields() {
  const body = $("similar-fields-body");
  const chev = $("similar-chevron");
  if (!body) return;
  const open = body.style.display !== "none";
  body.style.display = open ? "none" : "block";
  if (chev) chev.textContent = open ? "▼ expand" : "▲ collapse";
}

function addPairToVocab(colA, colB, tableA) {
  if (!state.table_vocab) state.table_vocab = [];
  let target = state.table_vocab.findIndex(v => !v.term || !v.term.trim());
  if (target === -1) {
    state.table_vocab.push({term:"", alias:"", definition:"", source:""});
    target = state.table_vocab.length - 1;
  }
  state.table_vocab[target].term = colA;
  state.table_vocab[target].alias = colB;
  state.table_vocab[target].source = tableA;
  refreshTableVocabUI();
  const vs = $("table-vocab-section");
  if (vs) vs.scrollIntoView({ behavior: "smooth", block: "nearest" });
  toast(`"${colA}" ↔ "${colB}" added to vocabulary ↓`);
}

// ── Table vocabulary (field alias/definition) ─────────────────────────────────
function tableVocabRow(v, i) {
  const sourceTag = v.source
    ? '<span style="font-size:10px;background:var(--blue-light);color:var(--blue);border-radius:100px;padding:1px 7px;font-family:var(--mono);margin-left:4px;">' + esc(v.source) + '</span>'
    : "";
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr 2fr 24px;gap:8px;margin-bottom:8px;align-items:start;">
    <div>
      <input type="text" placeholder="Term, field, or jargon" id="tv-term-${i}"
             value="${esc(v.term||'')}" oninput="state.table_vocab[${i}].term = this.value"
             style="font-size:12px;font-family:var(--mono);width:100%;">
      ${sourceTag}
    </div>
    <input type="text" placeholder="Alias (or leave blank)"
           value="${esc(v.alias||'')}" oninput="state.table_vocab[${i}].alias = this.value"
           style="font-size:12px;font-family:var(--mono);">
    <input type="text" placeholder="What it means or the standing rule"
           value="${esc(v.definition||'')}" oninput="state.table_vocab[${i}].definition = this.value"
           style="font-size:12px;">
    ${i >= 2 ? '<button onclick="removeTableVocab(' + i + ')" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:16px;padding:0;margin-top:8px;">✕</button>' : "<span></span>"}
  </div>`;
}

function refreshTableVocabUI() {
  const container = $("table-vocab-fields");
  if (!container) return;
  container.innerHTML = (state.table_vocab||[]).map((v,i) => tableVocabRow(v,i)).join("");
}

function addTableVocab() {
  if (!state.table_vocab) state.table_vocab = [];
  state.table_vocab.push({term:"", alias:"", definition:""});
  refreshTableVocabUI();
}

function removeTableVocab(i) {
  state.table_vocab.splice(i, 1);
  refreshTableVocabUI();
}

function toggleColPanel(id) {
  const body = $(id);
  const icon = $(id + "-icon");
  if (!body) return;
  body.classList.toggle("open");
  if (icon) icon.textContent = body.classList.contains("open") ? "▲" : "▼";
}

function tablesNext() {
  if (!state.tables_raw.trim()) { toast("Enter at least one table", true); return; }
  next();
}

// ── Step 4: KPIs ─────────────────────────────────────────────────────────────
function renderKPIs(el) {
  while (state.kpis.length < 3) state.kpis.push({name:"",definition:""});

  el.innerHTML = `
    <div class="panel">
      <div class="panel-title">KPIs in scope</div>
      <div class="step-info-row">
        <div class="panel-subtitle">List the metrics this project tracks. All fields flow into <code style="font-size:12px;background:var(--gray-100);padding:1px 5px;border-radius:4px">kpi_definitions.md</code> and <code style="font-size:12px;background:var(--gray-100);padding:1px 5px;border-radius:4px">EXAMPLES.md</code>.</div>
        <button class="info-btn" id="btn-info-kpis" onclick="toggleInfo('info-kpis')" title="What to know">?</button>
      </div>
      <div class="info-drawer" id="info-kpis">
        <strong>Field-by-field guidance</strong>
        <ul>
          <li><strong>KPI name</strong> — the canonical label your team uses. e.g. "NBRx Rolling 3M" not "new prescriptions". This becomes the section header in <code>kpi_definitions.md</code> and the example stub label in <code>EXAMPLES.md</code>.</li>
          <li><strong>Business definition</strong> — one sentence: what does this measure and why does it matter? e.g. "Count of unique patients with a first Jaypirca prescription in the rolling 3-month window, used to track new patient uptake." Avoid SQL jargon here — this is for the business reader.</li>
          <li><strong>Grain</strong> — one row per what? "One row per HCP per month" or "one row per patient" are the common choices. This shapes the dedup logic Claude applies. Use Custom for non-standard grains.</li>
          <li><strong>Time window</strong> — rolling 3M, rolling 12M, inception-to-date, point-in-time, etc. Be explicit — "rolling 12M ending last complete month" is clearer than "last year".</li>
          <li><strong>Known caveats</strong> — data lag, population gaps, truncation risk, channel exclusions. e.g. "LAAD claims lag ~6 weeks; most recent month should be excluded from trend reporting."</li>
          <li><strong>Pattern notes</strong> — optional pre-flight for Claude. e.g. "Pre-aggregate to monthly grain before applying rolling window. Use ROWS BETWEEN not RANGE BETWEEN on Redshift." This goes directly into <code>kpi_definitions.md</code> so Claude reads it before writing any SQL for this metric.</li>
          <li><strong>SQL logic</strong> — expand the section to choose: pick from your playbook, paste existing SQL, or describe the rules in structured fields. This populates the query stub in <code>EXAMPLES.md</code>.</li>
        </ul>
      </div>

      <div id="kpi-fields">

      <button class="btn btn-secondary" style="margin-bottom:1rem" onclick="addKPI()">+ Add KPI</button>

      <div class="divider"></div>

      <div class="field-group">
        <label class="field-label">Stakeholder notes
          <span style="font-weight:400;font-style:italic;color:var(--gray-400);font-size:11px;text-transform:none;"> — optional</span>
        </label>
        <textarea rows="3" placeholder="Any context useful for Claude — stakeholder priorities, known sensitivities, prior analyses to reference..."
                  oninput="state.stakeholder_notes = this.value">${esc(state.stakeholder_notes)}</textarea>
        <div class="field-hint">Optional. Populates stakeholder_notes.md if filled in.</div>
        <!-- Image drop zone for stakeholder reference images -->
        <div id="sn-image-zone"
             style="margin-top:8px;border:1.5px dashed var(--gray-200);border-radius:var(--radius);
                    padding:12px 16px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--gray-50);"
             ondragover="event.preventDefault();this.style.borderColor='var(--blue)';this.style.background='var(--blue-light)'"
             ondragleave="this.style.borderColor='var(--gray-200)';this.style.background='var(--gray-50)'"
             ondrop="handleStakeholderImageDrop(event)">
          <input type="file" accept="image/*" multiple
                 style="position:absolute;opacity:0;width:0;height:0;" id="sn-file-input"
                 onchange="handleStakeholderImageFiles(this.files)">
          <div style="font-size:12px;color:var(--gray-400);" id="sn-image-label">
            📎 <strong style="color:var(--blue);cursor:pointer;" onclick="$('sn-file-input').click()">Attach reference images</strong> or drag here
            <span style="display:block;font-size:11px;margin-top:3px;">Charts, mockups, or prior output snapshots — these are noted in stakeholder_notes.md for Claude reference.</span>

      <div class="btn-row">

// ── Playbook entries with keyword matching ────────────────────────────────────
const PLAYBOOK = [
  { id:"ex1",  label:"Diabetes patient summary with claims" },
  { id:"ex2",  label:"Obesity + diabetes comorbidity flag" },
  { id:"ex3",  label:"Monthly claims trend" },
  { id:"ex4",  label:"Top 10 highest-cost patients" },
  { id:"ex5",  label:"Activity call funnel" },
  { id:"ex6",  label:"Power BI DAX rolling 3-month paid claims" },
  { id:"ex7",  label:"Tableau LOD average claims per customer by region" },
  { id:"ex8",  label:"Rolling 6-month NBRx (BTK product)" },
  { id:"ex9",  label:"NBRx period-over-period growth — HCP level" },
  { id:"ex10", label:"NBRx period-over-period growth — market level" },
  { id:"ex11", label:"HCP account type segmentation" },
  { id:"ex12", label:"SoM bucket classification and concordance by regimen" },
  { id:"ex13", label:"Trialists, Users, and Adopters (TUA) by HCP × month" },
  { id:"ex14", label:"Net new HCPs per month" },
  { id:"ex15", label:"Dosing schedule classification by product" },
  { id:"ex16", label:"Mode of administration classification by product" },
  { id:"ex17", label:"HCPs who received a promotional detail for a given brand" },
  { id:"ex18", label:"HCPs who wrote NBRx for a specific patient age group" },
  { id:"ex19", label:"Cross-TA patient overlap analysis" },
];

function matchedPlaybook(kpiName) {
  return PLAYBOOK;
}

function buildPlaybookOptions(kpiName, currentEntry) {
  let html = `<option value="">— select —</option>`;
  html += PLAYBOOK.map(p =>
    `<option value="${p.id}" ${currentEntry === p.id ? "selected" : ""}>${p.label}</option>`
  ).join("");
  return html;
}

function kpiBlock(k, i) {
  const twOpts = ["","Latest 3 months","Latest 6 months","Latest 12 months","YTD","Rolling 3M","Rolling 6M","Rolling 12M","Custom window"];
  const grainOpts = ["","HCP","HCP x Month","Service date","Claim level","HCP x Claim","Custom"];
  const isFirst = i === 0;
  const headerLabel = (k.name||"").trim() || `KPI ${i+1}`;
  const mode = k.sql_source_mode || "";
  const rules = k.sql_rules || {};
  const pb = matchedPlaybook(k.name);

  const collapseId = `kpi-collapse-${i}`;
  const bodyId = `kpi-body-${i}`;

  return `
    <div class="kpi-block" id="${collapseId}" style="border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:12px;background:#fff;overflow:hidden;">

      ${!isFirst ? `
      <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none;background:var(--gray-50);"
           onclick="toggleKpiCollapse(${i})">
        <span style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.5px;">KPI ${i+1}</span>
        <span id="kpi-header-name-${i}" style="font-size:13px;font-weight:500;color:var(--gray-800);margin-left:4px;">${esc(headerLabel)}</span>
        <span id="kpi-chevron-${i}" style="margin-left:auto;font-size:12px;color:var(--gray-400);">${k._open ? "▲" : "▼"}</span>
        ${i >= 3 ? `<button onclick="event.stopPropagation();removeKPI(${i})" style="margin-left:8px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--gray-400);">✕</button>` : ""}
      </div>
      ` : `
      <div style="display:flex;align-items:center;gap:8px;padding:12px 16px 0 16px;">
        <span style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.5px;">KPI ${i+1}</span>
        ${i >= 3 ? `<button onclick="removeKPI(${i})" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:12px;color:var(--gray-400);">✕ Remove</button>` : ""}
      </div>
      `}

      <div id="${bodyId}" style="padding:12px 16px 14px;${!isFirst && !k._open ? 'display:none;' : ''}">

        <div class="field-group" style="margin-bottom:10px;">
          <label class="field-label">Metric name <span>*</span></label>
          <input type="text" value="${esc(k.name||"")}" placeholder="e.g. Trialist Rate"
                 oninput="state.kpis[${i}].name = this.value; updateKpiHeader(${i}, this.value);">
        </div>

        <div class="field-group" style="margin-bottom:10px;">
          <label class="field-label">Business definition</label>
          <textarea rows="2" placeholder="e.g. % of target HCPs who have written ≥1 Rx since launch. Numerator: HCPs with ≥1 Rx. Denominator: total target universe."
                    oninput="state.kpis[${i}].definition = this.value"
                    style="font-size:13px;">${esc(k.definition||"")}</textarea>
          <div class="field-hint">Plain English — what it measures, numerator, denominator.</div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
          <div class="field-group" style="margin-bottom:0;">
            <label class="field-label">Grain <span>*</span></label>
            <select id="grain-select-${i}" oninput="handleGrainSelect(${i}, this.value)">
              ${grainOpts.map(o =>
                `<option value="${o}" ${(k.grain||"")=== o ? "selected":""}>${o || "— select —"}</option>`
              ).join("")}
            </select>
            <input type="text" id="grain-custom-${i}"
                   placeholder="e.g. HCP × BTK decile"
                   value="${esc(k.grain_custom||"")}"
                   oninput="state.kpis[${i}].grain_custom = this.value"
                   style="margin-top:6px;display:${(k.grain||"")==='Custom'?'block':'none'};">
            <div class="field-hint">One row per what?</div>
          </div>
          <div class="field-group" style="margin-bottom:0;">
            <label class="field-label">Time window <span>*</span></label>
            <select id="tw-select-${i}" oninput="handleTwSelect(${i}, this.value)">
              ${twOpts.map(o => `<option value="${o}" ${(k.time_window||"")=== o ? "selected":""}>${o || "— select —"}</option>`).join("")}
            </select>
            <input type="text" id="tw-custom-${i}"
                   placeholder="e.g. 2024-01-01 to 2026-03-31"
                   value="${esc((k.time_window_custom)||"")}"
                   oninput="state.kpis[${i}].time_window_custom = this.value"
                   style="margin-top:6px;display:${(k.time_window||"")==='Custom window'?'block':'none'};">
            <div class="field-hint">Lookback or accumulation logic.</div>
          </div>
        </div>

        <!-- Merged caveats + pattern notes -->
        <div class="field-group" style="margin-bottom:10px;">
          <label class="field-label">Keep in mind
            <span style="font-weight:400;font-style:italic;color:var(--gray-400);font-size:11px;text-transform:none;"> — optional</span>
          </label>
          <textarea rows="3" placeholder="Data lag, exclusions, truncation risk, known quirks — and any pre-flight instructions for Claude before writing SQL (e.g. 'Pre-aggregate to monthly grain first. Use ROWS BETWEEN not RANGE BETWEEN on Redshift.')."
                    oninput="state.kpis[${i}].caveats = this.value"
                    style="font-size:13px;">${esc(k.caveats||k.pattern_notes||"")}</textarea>
          <div class="field-hint">Caveats and pattern guidance in one place. Claude reads this before writing any SQL for this metric.</div>
        </div>

        <!-- SQL logic section — collapsible -->
        <div style="border-top:1px solid var(--gray-100);margin-top:4px;padding-top:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;"
               onclick="toggleSqlSection(${i})">
            <span style="font-size:12px;font-weight:500;color:var(--blue);">＋ Add SQL logic</span>
            <span id="sql-chevron-${i}" style="font-size:11px;color:var(--gray-400);">${mode ? "▲" : "▼"}</span>
          </div>

          <div id="sql-section-${i}" style="${mode ? '' : 'display:none;'}margin-top:10px;">

            <div class="field-group" style="margin-bottom:10px;">
              <label class="field-label">SQL logic source</label>
              <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px;">
                ${["playbook","paste","describe"].map(m => `
                  <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                    <input type="radio" name="sql-mode-${i}" value="${m}"
                           ${mode===m?"checked":""}
                           onchange="handleSqlMode(${i}, '${m}')">
                    ${ m==="playbook" ? "Use from playbook" : m==="paste" ? "Paste existing SQL" : "Describe rules" }
                  </label>`).join("")}
              </div>
            </div>

            <!-- Playbook mode -->
            <div id="sql-playbook-${i}" style="${mode==='playbook'?'':'display:none;'}">
              <div class="field-group" style="margin-bottom:0;">
                <label class="field-label">Select playbook entry</label>
                <select id="sql-pb-select-${i}" oninput="state.kpis[${i}].sql_playbook_entry = this.value">
                  ${buildPlaybookOptions(k.name, k.sql_playbook_entry||"")}
                </select>
                <div class="field-hint">All 19 examples from EXAMPLES.md — pick the closest pattern.</div>
              </div>
            </div>

            <!-- Paste mode -->
            <div id="sql-paste-${i}" style="${mode==='paste'?'':'display:none;'}">
              <div class="field-group" style="margin-bottom:0;">
                <label class="field-label">Paste SQL</label>
                <textarea rows="5" placeholder="Paste your existing SQL here — it will be wrapped as a stub in EXAMPLES.md"
                          style="font-family:var(--mono);font-size:12px;"
                          oninput="state.kpis[${i}].sql_pasted = this.value">${esc(k.sql_pasted||"")}</textarea>
              </div>
            </div>

            <!-- Describe mode — simplified -->
            <div id="sql-describe-${i}" style="${mode==='describe'?'':'display:none;'}">
              <div class="field-group" style="margin-bottom:8px;">
                <label class="field-label">Columns used</label>
                <input type="text" placeholder="e.g. rendering_provider_id, service_date, new_to_brand_flag"
                       value="${esc((rules.columns)||"")}"
                       oninput="state.kpis[${i}].sql_rules.columns = this.value">
                <div class="field-hint">Exact column names from validated tables — avoids Claude inventing them.</div>
              </div>
              <div class="field-group" style="margin-bottom:8px;">
                <label class="field-label">Business rules <span>*</span></label>
                <textarea rows="2" placeholder="e.g. Cumulative NBRx per HCP since launch. Trialist=1, User=2, Adopter≥3."
                          oninput="state.kpis[${i}].sql_rules.business_rules = this.value"
                          style="font-size:13px;">${esc((rules.business_rules)||"")}</textarea>
                <div class="field-hint">Thresholds, filters, waterfall order — the core logic.</div>
              </div>
              <div class="field-group" style="margin-bottom:0;">
                <label class="field-label">Exclusions &amp; edge cases
                  <span style="font-weight:400;font-style:italic;color:var(--gray-400);font-size:11px;text-transform:none;"> — optional</span>
                </label>
                <textarea rows="2" placeholder="e.g. Exclude patient_birth_year IS NULL. Exclude specialty pharmacy. Month gaps — HCPs with no NBRx have no row."
                          oninput="state.kpis[${i}].sql_rules.exclusions = this.value"
                          style="font-size:13px;">${esc((rules.exclusions||"") + (rules.edge_cases ? "\n"+rules.edge_cases : ""))}</textarea>
                <div class="field-hint">Explicit exclusions and known edge cases combined.</div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>`;
}

function updateKpiHeader(i, name) {
  const el = $(`kpi-header-name-${i}`);
  if (el) el.textContent = name.trim() || `KPI ${i+1}`;
}

function toggleKpiCollapse(i) {
  const body = $(`kpi-body-${i}`);
  const chevron = $(`kpi-chevron-${i}`);
  if (!body) return;
  const isOpen = body.style.display !== "none";
  body.style.display = isOpen ? "none" : "block";
  state.kpis[i]._open = !isOpen;
  if (chevron) chevron.textContent = isOpen ? "▼" : "▲";
}

function toggleSqlSection(i) {
  const section = $(`sql-section-${i}`);
  const chevron = $(`sql-chevron-${i}`);
  if (!section) return;
  const isOpen = section.style.display !== "none";
  section.style.display = isOpen ? "none" : "block";
  if (chevron) chevron.textContent = isOpen ? "▼" : "▲";
}

function handleSqlMode(i, mode) {
  state.kpis[i].sql_source_mode = mode;
  // Show the right sub-panel, hide others
  ["playbook","paste","describe"].forEach(m => {
    const el = $(`sql-${m}-${i}`);
    if (el) el.style.display = m === mode ? "block" : "none";
  });
  // Refresh playbook dropdown to match current KPI name
  if (mode === "playbook") {
    const sel = $(`sql-pb-select-${i}`);
    if (sel) {
      sel.innerHTML = buildPlaybookOptions(state.kpis[i].name, state.kpis[i].sql_playbook_entry || "");
    }
  }
}

function removeKPI(i) {
  state.kpis.splice(i, 1);
  renderStep();
}

// ── Stakeholder image handling ────────────────────────────────────────────────
function handleStakeholderImageDrop(event) {
  event.preventDefault();
  const zone = document.getElementById("sn-image-zone");
  if (zone) { zone.style.borderColor = "var(--gray-200)"; zone.style.background = "var(--gray-50)"; }
  handleStakeholderImageFiles(event.dataTransfer.files);
}

function handleStakeholderImageFiles(files) {
  if (!files || !files.length) return;
  if (!state.stakeholder_images) state.stakeholder_images = [];
  const listEl = document.getElementById("sn-image-list");
  Array.from(files).forEach(file => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const entry = { name: file.name, size: Math.round(file.size/1024) + " KB", dataUrl: e.target.result };
      state.stakeholder_images.push(entry);
      if (listEl) {
        const div = document.createElement("div");
        div.style.cssText = "display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray-100);font-size:12px;";
        div.innerHTML = `<img src="${e.target.result}" style="width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--gray-200);">
          <span style="flex:1;color:var(--gray-800);">${esc(file.name)}</span>
          <span style="color:var(--gray-400);">${entry.size}</span>`;
        listEl.appendChild(div);
      }
    };
    reader.readAsDataURL(file);
  });
}
